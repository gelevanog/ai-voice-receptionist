<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Callie{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%230b7a83'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></span> Callie <span class="muted small">for {{ clinic.name }}</span></a>
    <nav>
      <a href="/" class="{{ 'active' if page == 'call' }}">Live call</a>
      <a href="/calls" class="{{ 'active' if page in ('calls', 'call_detail') }}">Call history</a>
      <a href="/calendar" class="{{ 'active' if page == 'calendar' }}">Calendar</a>
      <a href="/eval" class="{{ 'active' if page == 'eval' }}">Evaluation</a>
      <a href="/docs">API</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
    <footer>Callie: an AI voice receptionist. STT <code>{{ stack.stt }}</code> · LLM <code>{{ stack.llm }}</code> · TTS <code>{{ stack.tts }}</code> · VAD <code>{{ stack.vad }}</code>. {{ clinic.name }} is a fictional clinic.</footer>
  </main>
</body>
</html>
