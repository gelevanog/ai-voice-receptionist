# Simulated caller scenarios for the end-to-end evaluation.
#
# Written by hand for this repository by an AI agent (Claude), not collected from real callers. Every person,
# phone number and appointment is fictional. The clinic clock is frozen at Tuesday, October 6, 2026, 9:30 AM
# (America/New_York) unless a scenario sets `now`. An LLM plays the caller from `persona` / `goal` / `facts`;
# `opening` is the caller's first line (scripted, to save one API call per scenario); `interrupt` makes the
# caller talk over Callie at a given turn. `setup` creates existing appointments before the call.
# `expect` is checked deterministically against the database and the call record (see callie/eval/checks.py).
#
# channel: clean = 16 kHz; phone = 300-3400 Hz band, 8 kHz G.711 μ-law (the Twilio path); phone_noisy = phone
# plus babble noise at 10 dB SNR. voice = Piper libritts_r speaker id for the caller's synthetic voice.

- id: book_basic
  category: booking
  channel: clean
  voice: 12
  persona: Maria Gonzalez, friendly and organized.
  goal: Book a teeth cleaning next Tuesday afternoon. Take the first time offered.
  facts: {name: Maria Gonzalez, phone: "555 214 8839"}
  opening: Hi, I'd like to book a cleaning for next Tuesday afternoon, please.
  script:
    - The first one, please.
    - It's Maria Gonzalez, five five five, two one four, eight eight three nine.
    - Yes, that's right.
    - No, that's all. Thank you, bye! [END]
  expect: {outcome: booked, service: cleaning, day: "2026-10-13", after: "12:00", before: "18:00", name: Gonzalez, phone_last4: "8839"}

