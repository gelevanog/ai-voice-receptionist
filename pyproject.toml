[project]
name = "callie"
version = "0.1.0"
description = "Callie: an AI voice receptionist that answers calls, books appointments and hands off to a human. Real-time voice pipeline (VAD, streaming STT, tool-calling LLM, streaming TTS, barge-in) over browser WebSockets and Twilio Media Streams."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ivan Savchenko" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "fastapi",
    "httpx",
    "jinja2",
    "numpy>=2.0",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "pyyaml",
    "rich",
    "scipy",
    "sqlalchemy>=2.0",
    "structlog",
    "typer",
    "tzdata",
    "uvicorn[standard]",
]

[project.optional-dependencies]
# Local speech models on CPU: Silero VAD (ONNX), faster-whisper STT, Kokoro-82M TTS (ONNX).
# Weights are not bundled; `callie download-models` fetches them (see README > Models).
voice = ["faster-whisper>=1.2", "kokoro-onnx>=0.5", "onnxruntime>=1.20"]
# Piper voices for the simulated callers in the evaluation (a second, independent TTS engine).
# piper-tts is GPL-3.0-or-later; it is optional and never imported by the server.
piper = ["piper-tts>=1.3"]

[dependency-groups]
dev = ["mypy", "pytest", "pytest-asyncio", "pytest-timeout", "ruff", "scipy-stubs", "types-pyyaml"]

[project.scripts]
callie = "callie.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 120
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["models: needs the `voice` extra and downloaded models (skipped otherwise)"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PTH", "N", "C4", "PIE", "RET", "TC"]
ignore = ["TC001", "TC002", "TC003", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# The evaluation harness is offline batch tooling: simple polling loops and file writes are fine there.
"src/callie/eval/*" = ["ASYNC110", "ASYNC240"]
"tests/*" = ["E501", "ASYNC110"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Form", "fastapi.Header", "fastapi.Depends", "fastapi.Query", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["callie"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "kokoro_onnx.*", "onnxruntime.*", "piper.*", "ctranslate2.*"]  # optional `voice` / `piper` extras
ignore_missing_imports = true
follow_imports = "skip"
